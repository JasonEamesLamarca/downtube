<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="38" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="start" font-weight="700">Network path (public HTTPS on a Synology NAS)</text><rect x="30" y="80" width="190" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="104" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Phone / laptop</text><text x="125.0" y="126" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">on the internet</text><rect x="270" y="80" width="200" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="370.0" y="104" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">Public DNS</text><text x="370.0" y="126" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">downtube.example.com</text><text x="370.0" y="144" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">CNAME → DDNS name</text><rect x="520" y="80" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="620.0" y="104" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">ISP router</text><text x="620.0" y="126" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">forward TCP 80/443</text><text x="620.0" y="144" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">→ home router</text><rect x="770" y="80" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="870.0" y="104" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">Home router</text><text x="870.0" y="126" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">forward TCP 80/443</text><text x="870.0" y="144" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">→ NAS LAN IP</text><rect x="720" y="230" width="460" height="300" rx="14" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="8 5"/><text x="734" y="252" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#be123c" text-anchor="start" font-weight="700">NAS (Synology DSM)</text><rect x="745" y="270" width="410" height="90" rx="10" fill="#fde8ec" stroke="#be123c" stroke-width="2"/><text x="950.0" y="294" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#be123c" text-anchor="middle" font-weight="700">DSM nginx reverse proxy</text><text x="950.0" y="316" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Let's Encrypt certificate · HSTS</text><text x="950.0" y="334" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">rules: https:443 + http:80 → localhost:8092</text><rect x="745" y="400" width="410" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="950.0" y="424" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">downtube container</text><text x="950.0" y="446" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">bound to 127.0.0.1:8092 only</text><text x="950.0" y="464" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">DOWNTUBE_TRUSTED_PROXIES = docker bridge</text><text x="950.0" y="482" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">HTTP → HTTPS 308 redirect</text><line x1="220" y1="125" x2="270" y2="125" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><line x1="470" y1="125" x2="520" y2="125" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><line x1="720" y1="125" x2="770" y2="125" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><line x1="870" y1="170" x2="950" y2="270" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><text x="945" y="215" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">80 / 443</text><line x1="950" y1="360" x2="950" y2="400" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="30" y="300" width="230" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="145.0" y="324" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">LAN client</text><text x="145.0" y="346" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">same home network</text><rect x="30" y="420" width="300" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="180.0" y="444" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">Local DNS (e.g. Pi-hole)</text><text x="180.0" y="466" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">downtube.example.com</text><text x="180.0" y="484" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">→ NAS LAN IP (split DNS)</text><line x1="145" y1="390" x2="145" y2="420" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><text x="200" y="410" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">1. lookup</text><line x1="260" y1="330" x2="745" y2="315" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><text x="500" y="305" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">2. HTTPS straight to the NAS LAN IP</text><text x="30" y="560" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="start" font-style="italic">Without split DNS, LAN clients resolve the public IP and time out on routers without NAT loopback.</text></svg>
