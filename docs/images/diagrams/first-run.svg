<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="38" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="start" font-weight="700">First run: from container start to the dashboard</text><rect x="25" y="90" width="172" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="111.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">1. Deploy</text><text x="111.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">docker compose up</text><text x="111.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">or deploy_nas.sh</text><rect x="222" y="90" width="172" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="308.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">2. Setup code</text><text x="308.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">printed in the</text><text x="308.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">container log</text><line x1="200" y1="145" x2="222" y2="145" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="419" y="90" width="172" height="110" rx="10" fill="#fde8ec" stroke="#be123c" stroke-width="2"/><text x="505.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#be123c" text-anchor="middle" font-weight="700">3. /setup page</text><text x="505.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">code + Google client</text><text x="505.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ID/secret + allowlist</text><line x1="397" y1="145" x2="419" y2="145" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="616" y="90" width="172" height="110" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="702.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">4. Google sign-in</text><text x="702.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">OAuth PKCE</text><text x="702.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">youtube.readonly</text><line x1="594" y1="145" x2="616" y2="145" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="813" y="90" width="172" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="899.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="700">5. Acknowledge</text><text x="899.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">rights &amp;</text><text x="899.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">responsibility</text><line x1="791" y1="145" x2="813" y2="145" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="1010" y="90" width="172" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="1096.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">6. Dashboard</text><text x="1096.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">sync subscriptions</text><text x="1096.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">choose archive rules</text><line x1="988" y1="145" x2="1010" y2="145" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><text x="25" y="250" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="start">The setup code is single-use and stored only as a hash; a new one is printed on every start until setup is complete.</text><text x="25" y="275" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="start">Client secret and tokens are stored Fernet-encrypted; the allowlist is checked on every request and by the scheduler.</text></svg>
