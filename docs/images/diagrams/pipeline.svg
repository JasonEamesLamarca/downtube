<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="38" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="start" font-weight="700">From a like or a new upload to a file in the archive</text><rect x="25" y="90" width="150" height="120" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="100.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">Discover</text><text x="100.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">likes poll</text><text x="100.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">channel rules</text><text x="100.0" y="172" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">manual URL</text><rect x="193" y="90" width="150" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="268.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">Queue</text><text x="268.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">job in SQLite</text><text x="268.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">dedup per video</text><text x="268.0" y="172" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">priority + cap</text><line x1="175" y1="150" x2="193" y2="150" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="361" y="90" width="150" height="120" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="436.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="700">Probe</text><text x="436.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">yt-dlp -J</text><text x="436.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">pick best original</text><text x="436.0" y="172" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">≤ cap, no upscale</text><line x1="343" y1="150" x2="361" y2="150" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="529" y="90" width="150" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="604.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">Download</text><text x="604.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">video + audio</text><text x="604.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">into /temp</text><text x="604.0" y="172" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">resumable</text><line x1="511" y1="150" x2="529" y2="150" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="697" y="90" width="150" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="772.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">Merge</text><text x="772.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ffmpeg remux</text><text x="772.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">stream copy → MP4</text><text x="772.0" y="172" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">no re-encode</text><line x1="679" y1="150" x2="697" y2="150" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="865" y="90" width="150" height="120" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="940.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="700">Validate</text><text x="940.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ffprobe checks</text><text x="940.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">codecs, size,</text><text x="940.0" y="172" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">duration, height</text><line x1="847" y1="150" x2="865" y2="150" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="1033" y="90" width="150" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="1108.0" y="114" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">Finalize</text><text x="1108.0" y="136" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">atomic move to</text><text x="1108.0" y="154" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">/archive/&lt;Channel&gt;/</text><text x="1108.0" y="172" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">record media file</text><line x1="1015" y1="150" x2="1033" y2="150" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="25" y="270" width="560" height="150" rx="10" fill="#fde8ec" stroke="#be123c" stroke-width="2"/><text x="305.0" y="294" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#be123c" text-anchor="middle" font-weight="700">Failure handling</text><text x="305.0" y="316" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">network / 5xx / throttling → retry with exponential backoff (max attempts)</text><text x="305.0" y="334" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">video private or deleted → skipped, availability recorded</text><text x="305.0" y="352" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">no acceptable stream/container → unsupported (never re-encoded)</text><text x="305.0" y="370" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">restart or shutdown → job re-queued, partial data kept, attempt not counted</text><rect x="615" y="270" width="560" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="895.0" y="294" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">Quality policy</text><text x="895.0" y="316" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">cap = channel / likes / manual setting (720p … 2160p)</text><text x="895.0" y="334" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">short side ≤ cap, so portrait and ultrawide videos work</text><text x="895.0" y="352" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">prefer the highest original stream; AAC audio by default</text><text x="895.0" y="370" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">a later higher cap creates an 'upgrade' job; old file kept as .superseded</text></svg>
