[project]
name = "downtube"
version = "0.6.2"
description = "Self-hosted YouTube archiving platform (likes + subscriptions, original quality up to 4K, MP4)"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1.9",
  "alembic>=1.20.1",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28.1",
  "cryptography>=50.0.2",
  "apscheduler>=3.11.3,<4",
  "python-multipart>=0.0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "respx>=0.23",
  "ruff>=0.17",
  "mypy>=2.4",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["downtube*"]

[tool.setuptools.package-data]
downtube = ["migrations/*.py", "migrations/versions/*.py", "migrations/*.mako", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs real Google credentials / network (skipped in CI)",
  "media: needs ffmpeg/ffprobe binaries",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "F811", "E731"]
"downtube/migrations/**" = ["E501", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
